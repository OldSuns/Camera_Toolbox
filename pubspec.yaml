name: oldsun_camera_toolbox
description: "OldSun相机工具箱 - 一款功能强大的相机工具应用，专为摄影爱好者和专业摄影师设计"
publish_to: 'none'
version: 1.3.3+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  exif_reader: ^3.16.1
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  path_provider: ^2.1.2
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.2.2
  path: ^1.9.1
  window_manager: ^0.5.1
  permission_handler: ^12.0.1
  image: ^4.5.4
  crypto: ^3.0.3
  desktop_drop: ^0.6.1
  cross_file: ^0.3.4+2
  url_launcher: ^6.3.2
  flutter_colorpicker: ^1.1.0
  gal: ^2.3.2
  device_info_plus: ^11.5.0
  simple_native_image_compress: ^3.0.2
  data_table_2: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 128 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - lib/data/camera_data/
    - lib/data/logos/
    - lib/data/fonts/
  fonts:
    - family: AlibabaPuHuiTi-Light
      fonts:
        - asset: lib/data/fonts/AlibabaPuHuiTi-2-45-Light.otf
    - family: AlibabaPuHuiTi-Bold
      fonts:
        - asset: lib/data/fonts/AlibabaPuHuiTi-2-85-Bold.otf
          weight: 700
    - family: Roboto-Regular
      fonts:
        - asset: lib/data/fonts/Roboto-Regular.ttf
    - family: Roboto-Medium
      fonts:
        - asset: lib/data/fonts/Roboto-Medium.ttf
          weight: 500