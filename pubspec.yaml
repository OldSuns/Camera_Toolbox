name: oldsun_camera_toolbox
description: "OldSun相机工具箱 - 一款功能强大的相机工具应用，专为摄影爱好者和专业摄影师设计"
publish_to: 'none'
version: 1.1.2+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  exif_reader: ^3.16.1
  image_picker: ^1.0.7
  file_picker: ^10.2.0
  path_provider: ^2.1.2
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.2.2
  path: ^1.9.1
  window_manager: ^0.5.1
  permission_handler: ^12.0.1
  image: ^4.5.4
  crypto: ^3.0.3
  desktop_drop: ^0.6.1
  cross_file: ^0.3.4+2
  shorebird_code_push: ^2.0.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - lib/data/camera_data/
