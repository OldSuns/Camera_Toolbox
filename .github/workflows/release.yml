name: Build and Release Flutter App

on:
  push:
    tags:
      - 'v*'

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi && break || sleep 10
          done
        timeout-minutes: 60

      - name: Build AppBundle
        run: |
          for i in 1 2 3; do
            flutter build appbundle --release && break || sleep 10
          done
        timeout-minutes: 60

      - name: Archive Android release
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "⚠️ 未找到默认 Android 构建产物，尝试搜索..."
            FOUND_APK=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
            FOUND_AAB=$(find build/app/outputs -type f -name "*.aab" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              echo "✅ 使用找到的 APK: $FOUND_APK"
              APK_PATH="$FOUND_APK"
            else
              echo "❌ 未找到 APK 文件"
              exit 1
            fi
            if [ -n "$FOUND_AAB" ]; then
              echo "✅ 使用找到的 AAB: $FOUND_AAB"
              AAB_PATH="$FOUND_AAB"
            else
              echo "❌ 未找到 AAB 文件"
              exit 1
            fi
          fi
          mkdir -p android-release
          cp "$APK_PATH" android-release/
          cp "$AAB_PATH" android-release/
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-release/

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive Windows release
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-Not (Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          if (-Not (Test-Path $releaseDir)) {
            Write-Host "⚠️ 未找到默认 Windows Release 目录，尝试搜索..."
            $searchPath = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($searchPath) {
              $releaseDir = $searchPath.FullName
              Write-Host "✅ 使用找到的 Release 目录: $releaseDir"
            } else {
              echo "❌ Windows Release 目录不存在，构建可能失败"
              exit 1
            }
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "windows-release.zip"
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS arm64
        run: |
          flutter build macos --release --dart-define=FLUTTER_TARGET_ARCH=arm64
          mkdir -p build/macos/Build/Products/Release-arm64
          mv build/macos/Build/Products/Release/*.app build/macos/Build/Products/Release-arm64/

      - name: Build macOS x86_64
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          flutter build macos --release --dart-define=FLUTTER_TARGET_ARCH=x86_64
          mkdir -p build/macos/Build/Products/Release-x86_64
          mv build/macos/Build/Products/Release/*.app build/macos/Build/Products/Release-x86_64/

      - name: Archive macOS arm64
        run: |
          cd build/macos/Build/Products/Release-arm64
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print0 | xargs -0 basename)
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "../../../../macos-arm64.zip"
          cd ../../../../../

      - name: Archive macOS x86_64
        run: |
          cd build/macos/Build/Products/Release-x86_64
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print0 | xargs -0 basename)
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "../../../../macos-x86_64.zip"
          cd ../../../../../

      - name: Upload macOS arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: macos-arm64.zip

      - name: Upload macOS x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: macos-x86_64.zip

  release:
    name: Create Release
    needs: [build_android, build_windows, build_macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release_notes.md
          files: |
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
            artifacts/windows-release/*.zip
            artifacts/macos-arm64/macos-arm64.zip
            artifacts/macos-x86_64/macos-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
