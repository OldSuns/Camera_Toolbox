name: Build and Release Flutter App

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.41.5'

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release && break || sleep 10
          done
        timeout-minutes: 60


      - name: Archive Android release
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "⚠️ 未找到默认 Android 构建产物，尝试搜索..."
            FOUND_APK=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              echo "✅ 使用找到的 APK: $FOUND_APK"
              APK_PATH="$FOUND_APK"
            else
              echo "❌ 未找到 APK 文件"
              exit 1
            fi
          fi
          mkdir -p android-release
          cp "$APK_PATH" "android-release/Camera_Toolbox_Android_Release.apk"
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-release
          path: android-release/Camera_Toolbox_Android_Release.apk

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive Windows release
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-Not (Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          if (-Not (Test-Path $releaseDir)) {
            Write-Host "⚠️ 未找到默认 Windows Release 目录，尝试搜索..."
            $searchPath = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($searchPath) {
              $releaseDir = $searchPath.FullName
              Write-Host "✅ 使用找到的 Release 目录: $releaseDir"
            } else {
              echo "❌ Windows Release 目录不存在，构建可能失败"
              exit 1
            }
          }
          New-Item -ItemType Directory -Force -Path "windows-release"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "windows-release/Camera_Toolbox_Windows_Release.zip"
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: windows-release/Camera_Toolbox_Windows_Release.zip

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Universal
        run: |
          flutter build macos --release

      - name: Archive macOS release
        run: |
          RELEASE_DIR="build/macos/Build/Products/Release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "❌ macOS Release 目录不存在: $RELEASE_DIR"
            echo "可用的构建目录:"
            find build/macos -type d -name "*Release*" 2>/dev/null || echo "未找到任何Release目录"
            exit 1
          fi
          
          APP_NAME=$(find "$RELEASE_DIR" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_NAME" ]; then
            echo "❌ 未找到 .app 文件"
            echo "目录内容:"
            ls -la "$RELEASE_DIR"
            exit 1
          fi
          
          echo "✅ 找到应用: $(basename "$APP_NAME")"
          
          # 创建输出目录（先清理旧文件）
          rm -rf "$GITHUB_WORKSPACE/macos-release"
          mkdir -p "$GITHUB_WORKSPACE/macos-release"
          
          # 使用ditto创建ZIP包，保持macOS应用包结构
          cd "$RELEASE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_NAME")" "$GITHUB_WORKSPACE/macos-release/Camera_Toolbox_MacOS_Release.zip"
          
          echo "✅ ZIP包已创建: macos-release/Camera_Toolbox_MacOS_Release.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: macos-release/Camera_Toolbox_MacOS_Release.zip

  release:
    name: Create Release
    needs: [build_android, build_windows, build_macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/android-release/*.apk
            artifacts/windows-release/*.zip
            artifacts/macos-release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
